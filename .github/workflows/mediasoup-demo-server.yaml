name: mediasoup-demo-server

on:
  push:
    branches: [v3]
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel a currently running workflow from the same PR, branch or tag when a
  # new workflow is triggered.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install project dependencies
        working-directory: server
        run: npm ci

      - name: Install test dependencies temporarily
        working-directory: server
        run: npm install --no-save jest@29.7.0 ts-jest@29.2.5 @types/jest@29.5.13

      - name: Run tests
        working-directory: server
        run: npx jest  # Or "npx jest --ci --verbose" for more output

  build:
    runs-on: ubuntu-latest
    needs: test  # Run build after test succeeds
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile  # Assuming Dockerfile is in root
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/mediasoup-demo:latest  # Update to your repo/image name

  deploy:
    runs-on: ubuntu-latest
    needs: build  # Run deploy after build succeeds
    if: github.ref == 'refs/heads/main'  # Only deploy on main branch pushes
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update deployment image
        working-directory: k8s
        run: |
          sed -i "s|image: demo:latest|image: ${{ secrets.DOCKER_USERNAME }}/mediasoup-demo:latest|g" deployment.yaml  # Update image tag in YAML

      - name: Deploy to Kubernetes
        run: kubectl apply -f k8s/